# Pages CMS configuration — https://pagescms.org/docs/
#
# Gives non-developers a friendly editing UI over this repo's content.
# Sign in at https://app.pagescms.org with GitHub, open this repo and
# select the `v2` BRANCH (the site deploys from v2, not main).
#
# Every save commits to the branch → GitHub Actions rebuilds and
# deploys the site automatically (~1 min).
#
# The field definitions below MUST stay in lockstep with the Zod
# schemas in v2/src/content/config.ts — if you add a field there,
# add it here too (and vice versa).

media:
  input: v2/public/assets/images
  output: /assets/images

content:
  # ── Journal entries ────────────────────────────────────────────────
  # One markdown file per entry. `draft: true` keeps an entry off the
  # live site. The `_template` entry is a permanent draft — don't delete.
  - name: journal
    label: Journal entries
    type: collection
    path: v2/src/content/journal
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - value: news
              label: News
            - value: articles
              label: Articles
            - value: interests
              label: Interests
            - value: event-reports
              label: Event reports
            - value: research
              label: Research
            - value: projects
              label: Projects
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        description: One or two sentences shown on the Journal index card.
        type: text
      - name: coverImage
        label: Cover image
        description: Optional. Used as the thumbnail on the Journal index card and as the full-bleed header at the top of the article page.
        type: image
      - name: coverImageAlt
        label: Cover image description (alt text)
        type: string
      - name: externalUrl
        label: External link
        description: Optional. If set, the index card links out to this URL instead of an article page.
        type: string
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: false
      - name: body
        label: Article body
        type: rich-text

