# Builds the v2/ Astro site and publishes it to GitHub Pages.
#
# Triggers on push to the `v2` branch (and manual dispatch). The repo's
# Pages source must be set to "GitHub Actions" in repo settings.
#
# At runtime we tell Astro to build with:
#   SITE_URL  = https://ipancaldi.github.io
#   BASE_PATH = /interval/
# so every asset path resolves under the project-pages sub-path.

name: Deploy v2 to GitHub Pages

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        working-directory: v2
        run: npm ci

      - name: Build Astro
        working-directory: v2
        env:
          SITE_URL: https://ipancaldi.github.io
          BASE_PATH: /interval/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
